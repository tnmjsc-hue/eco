name: Daily ETH network research proxies
on:
  schedule:
    - cron: '47 3,7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-eth-publication
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned computation dependencies
        run: python -m pip install -r requirements.txt
      - name: Capture Community history, verify private backup and publish research
        id: batch
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: '3ebcb7a2f66c7ae9b5804ff91e6ec702'
          R2_BUCKET: eco-eth-private
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m eco.proxy_pipeline daily
      - name: Join verified parents into ECO 7 Experimental
        id: extended
        if: always() && steps.batch.outcome == 'success'
        continue-on-error: true
        run: python -m eco.seven
      - name: Publish pinned NUPL, supply and exchange diagnostics
        id: diagnostics
        if: always() && steps.batch.outcome == 'success'
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: '3ebcb7a2f66c7ae9b5804ff91e6ec702'
          R2_BUCKET: eco-eth-private
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m eco.diagnostic_pipeline daily
      - name: Integrate qualified metrics into Core 10 Experimental
        id: core_ten
        if: always() && steps.extended.outcome == 'success' && steps.diagnostics.outcome == 'success'
        continue-on-error: true
        run: python -m eco.core_ten
      - name: Verify data and source contracts
        id: verify
        if: steps.batch.outcome == 'success'
        run: |
          python -m unittest discover -s tests -v
          node --test tests/*.test.mjs
          node scripts/validate-research-artifacts.mjs
          git diff --check
      - name: Commit verified proxy artifacts only
        id: commit
        if: always() && (steps.verify.outcome == 'success' || steps.batch.outcome == 'failure')
        env:
          BATCH_OUTCOME: ${{ steps.batch.outcome }}
          EXTENDED_OUTCOME: ${{ steps.extended.outcome }}
          DIAGNOSTICS_OUTCOME: ${{ steps.diagnostics.outcome }}
          CORE_TEN_OUTCOME: ${{ steps.core_ten.outcome }}
        run: |
          git config user.name 'eco-daily[bot]'
          git config user.email 'eco-daily[bot]@users.noreply.github.com'
          git add -- public/data/network-proxies/status.json
          if [ "$CORE_TEN_OUTCOME" != 'skipped' ] && [ -f public/data/core-v2/status.json ]; then
            git add -- public/data/core-v2/status.json
          fi
          if [ "$DIAGNOSTICS_OUTCOME" != 'skipped' ] && [ -f public/data/diagnostics/status.json ]; then
            git add -- public/data/diagnostics/status.json
          fi
          if [ "$EXTENDED_OUTCOME" != 'skipped' ] && [ -f public/data/extended/status.json ]; then
            git add -- public/data/extended/status.json
          fi
          if [ "$BATCH_OUTCOME" = 'success' ]; then
            if [ "$CORE_TEN_OUTCOME" = 'success' ]; then
              git add -- public/data/core-v2/latest.json public/data/core-v2/releases public/data/core-v2/revisions public/data/core-v2/publications
            fi
            git add -- public/data/network-proxies/latest.json public/data/network-proxies/releases
            if [ "$EXTENDED_OUTCOME" = 'success' ]; then
              git add -- public/data/extended/latest.json public/data/extended/releases
            fi
            if [ "$DIAGNOSTICS_OUTCOME" = 'success' ]; then
              git add -- public/data/diagnostics/latest.json public/data/diagnostics/releases public/data/diagnostics/revisions public/data/diagnostics/publications
            fi
          fi
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git diff --cached --check
            git commit -m "Update ETH network research proxies ($(date -u +%F))"
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify production Core and proxy checksums
        if: always() && steps.commit.outputs.changed == 'true'
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: node scripts/verify-daily-deploy.mjs
      - name: Surface capture or backup failure
        if: always() && (steps.batch.outcome == 'failure' || steps.extended.outcome == 'failure' || steps.diagnostics.outcome == 'failure' || steps.core_ten.outcome == 'failure')
        run: exit 1
