name: Official economic calendar
on:
  schedule:
    - cron: '37 0 * * *'
    - cron: '37 13,18 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-eth-publication
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install PDF text reader for official DOL releases
        run: python -m pip install --disable-pip-version-check pypdf==6.10.0
      - name: Restore only public official feed cache (no secrets)
        uses: actions/cache@v4
        with:
          path: |
            data/raw/calendar/cache
            data/raw/macro-market/cache
          key: official-calendar-market-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            official-calendar-market-v1-
            official-calendar-v1-
      - name: Fetch official data and verify private snapshot before publication
        id: batch
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: '3ebcb7a2f66c7ae9b5804ff91e6ec702'
          R2_BUCKET: eco-eth-private
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m eco.calendar
      - name: Assess verified calendar and retain immutable macro history
        id: macro
        if: always()
        continue-on-error: true
        run: python -m eco.macro_pipeline
      - name: Validate macro engine and publication contracts
        id: macro_verify
        if: always() && steps.macro.outcome == 'success'
        run: |
          python -m unittest discover -s tests -p 'test_macro*.py' -v
          node --test tests/macro.test.mjs
          git diff --check
      - name: Record prospective ETH cases and evaluate probability gates
        id: probability
        if: always()
        continue-on-error: true
        run: python -m eco.macro_probability
      - name: Validate probability model and publication
        id: probability_verify
        if: always() && steps.probability.outcome == 'success'
        run: |
          python -m unittest discover -s tests -p test_macro_probability.py -v
          node --test tests/macro-probability.test.mjs
          git diff --check
      - name: Measure daily markets and verify private snapshot
        id: market
        if: always()
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: '3ebcb7a2f66c7ae9b5804ff91e6ec702'
          R2_BUCKET: eco-eth-private
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m eco.macro_market
      - name: Validate daily market publication
        id: market_verify
        if: always() && steps.market.outcome == 'success'
        run: |
          python -m unittest discover -s tests -p test_macro_market.py -v
          node --test tests/macro-market.test.mjs
          git diff --check
      - name: Validate calendar contracts
        id: verify
        if: steps.batch.outcome == 'success'
        run: |
          python -m unittest discover -s tests -p test_calendar.py -v
          node --test tests/calendar.test.mjs
          git diff --check
      - name: Commit calendar allowlist
        id: commit
        if: always() && (steps.verify.outcome == 'success' || steps.batch.outcome == 'failure' || steps.market_verify.outcome == 'success')
        env:
          BATCH_OUTCOME: ${{ steps.batch.outcome }}
          MACRO_OUTCOME: ${{ steps.macro.outcome }}
          MACRO_VERIFY: ${{ steps.macro_verify.outcome }}
          MARKET_OUTCOME: ${{ steps.market.outcome }}
          MARKET_VERIFY: ${{ steps.market_verify.outcome }}
          PROBABILITY_OUTCOME: ${{ steps.probability.outcome }}
          PROBABILITY_VERIFY: ${{ steps.probability_verify.outcome }}
        run: |
          git config user.name 'eco-daily[bot]'
          git config user.email 'eco-daily[bot]@users.noreply.github.com'
          git add -- public/data/calendar/status.json
          git add -- public/data/macro-assessment/status.json
          if [ "$BATCH_OUTCOME" = 'success' ] && [ "$MACRO_VERIFY" = 'success' ]; then
            git add -- public/data/calendar/latest.json public/data/calendar/releases
          fi
          if [ "$MACRO_OUTCOME" = 'success' ] && [ "$MACRO_VERIFY" = 'success' ]; then
            git add -- public/data/macro-assessment/latest.json public/data/macro-assessment/releases public/data/macro-assessment/inputs public/data/macro-assessment/records
          fi
          if [ "$MARKET_VERIFY" = 'success' ]; then
            git add -- public/data/macro-market/latest.json public/data/macro-market/status.json public/data/macro-market/releases
          elif [ "$MARKET_OUTCOME" = 'failure' ]; then
            git add -- public/data/macro-market/status.json
          fi
          if [ "$PROBABILITY_VERIFY" = 'success' ] && [ "$MACRO_VERIFY" = 'success' ]; then
            for task_path in latest.json status.json releases records outcomes; do
              if [ -e "public/data/macro-probability/$task_path" ]; then
                git add -- "public/data/macro-probability/$task_path"
              fi
            done
          elif [ "$PROBABILITY_OUTCOME" = 'failure' ]; then
            git add -- public/data/macro-probability/status.json
          fi
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "Update official calendar and macro assessment ($(date -u +%F))"
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy and verify calendar pointer and immutable release
        if: always() && steps.commit.outputs.changed == 'true'
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: node scripts/verify-calendar-deploy.mjs
      - name: Surface data failure
        if: always() && (steps.batch.outcome == 'failure' || steps.macro.outcome == 'failure' || steps.macro_verify.outcome == 'failure' || steps.market.outcome == 'failure' || steps.market_verify.outcome == 'failure' || steps.probability.outcome == 'failure' || steps.probability_verify.outcome == 'failure')
        run: exit 1
